# PR 이 웹(apps/web) 타입 검사와 린트를 통과하는지 본다. 비밀값 없이 돈다(빌드는 하지 않는다).
# 필수 검사로 걸어 두려고 경로 필터 없이 모든 PR 에서 돈다(경로 필터가 있으면 웹을 안 고친 PR 이 검사 대기로 멈춘다).
name: 웹 검사

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: 웹 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # npm ci 는 잠금 파일과 npm 버전이 조금만 달라도 멈춰서 install 을 쓴다. 여기서 바뀐 잠금 파일은 커밋되지 않는다.
      - name: 패키지 설치
        run: npm install --no-audit --no-fund
      - name: 타입 검사
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: 린트
        run: npm run lint
