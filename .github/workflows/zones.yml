# PR 이 브랜치 이름에 맞는 폴더만 고쳤는지 본다. 규칙은 .github/scripts/check_zones.py, 설명은 docs/COLLAB.md.
name: 구역 검사

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  zones:
    name: 구역 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 구역 확인
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: python3 .github/scripts/check_zones.py
